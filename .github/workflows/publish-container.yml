name: Publish container package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and verify image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=CPU PyTorch medical image classification pipeline" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image:$RELEASE_TAG" .
          docker run --rm "$image:$RELEASE_TAG" --help
          docker run --rm --entrypoint python "$image:$RELEASE_TAG" smoke_test.py
      - name: Publish to GitHub Packages
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$RELEASE_TAG"
