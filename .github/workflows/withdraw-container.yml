name: Withdraw published container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  withdraw:
    if: github.repository == 'Zefyr61-Liu/multi-cancer-image-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Withdraw this repository's container package
        run: |
          endpoint='users/Zefyr61-Liu/packages/container/multi-cancer-image-analysis'
          gh api "$endpoint" --jq '{name, version_count, repository: .repository.full_name}'
          gh api --method DELETE "$endpoint"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/$endpoint")"
          echo "Package lookup after withdrawal: HTTP $status"
          test "$status" = 404
